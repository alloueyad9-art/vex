function render(data){
    const grid=document.getElementById('pitches');
    grid.innerHTML=data.map(p=>{
        const typeColor = p.type==='pitch'?'tag-cat':p.type==='yes'?'tag-yes':p.type==='no'?'tag-no':'tag-follow';
        const typeName = p.type==='pitch'?'PITCH':p.type==='yes'?'YES':p.type==='no'?'NO':'FOLLOW-UP';
        return `
        <div class="pitch-card" data-type="${p.type}" data-cat="${p.cat}">
            <div class="pitch-head">
                <div>
                    <div class="pitch-name">${p.name}</div>
                    <div class="pitch-meta">
                        <span class="pitch-tag ${typeColor}">${typeName}</span>
                        <span class="pitch-tag tag-step">${p.step}</span>
                    </div>
                </div>
            </div>
            <div class="pitch-text">${p.text}</div>
            <div class="pitch-actions">
                <button class="btn-copy" onclick="copyText(this,${JSON.stringify(p.text).replace(/"/g,'&quot;')})">📋 Copy Script</button>
                <a class="btn-wa" href="https://wa.me/${(p.phone||'').replace(/[^0-9]/g,'')}" target="_blank">💬 WhatsApp</a>
            </div>
        </div>`;
    }).join('');
}

function copyText(btn,text){
    navigator.clipboard.writeText(text);
    btn.textContent='✅ Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copy Script';btn.classList.remove('copied')},2000);
}

function filterAll(){render(pitches);setActive(0)}
function filterType(t){render(pitches.filter(p=>p.type===t));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))}
function setActive(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i))}

render(pitches);
</script>
</body>
</html>
