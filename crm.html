<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX — Sales CRM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--gold-light:#E8D48B;--dark:#0A0A0A;--card:#111;--border:rgba(255,255,255,.06);--text:rgba(255,255,255,.7);--text2:rgba(255,255,255,.35);--green:#22C55E;--red:#EF4444;--yellow:#FBBF24;--blue:#3B82F6}
body{font-family:'Space Grotesk',sans-serif;background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.nav-logo span{color:var(--gold)}
.nav-links{display:flex;gap:6px}
.nav-link{padding:8px 16px;font-size:.72rem;color:var(--text2);cursor:pointer;border:1px solid transparent;border-radius:4px;transition:all .3s;font-family:'Space Grotesk',sans-serif;background:none;letter-spacing:.03em}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav-link.active{color:var(--gold);background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.15)}
.page{display:none;padding:80px 32px 40px;max-width:1200px;margin:0 auto}
.page.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px}
.stat{background:var(--card);border:1px solid var(--border);padding:16px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;line-height:1}
.stat .label{font-size:.6rem;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.filters{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter{padding:5px 14px;background:transparent;border:1px solid rgba(255,255,255,.08);color:var(--text2);font-size:.68rem;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .3s;border-radius:3px}
.filter:hover{color:#fff;border-color:rgba(255,255,255,.15)}
.filter.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.search{width:100%;padding:10px 16px;background:var(--card);border:1px solid var(--border);color:#fff;font-size:.82rem;font-family:'Space Grotesk',sans-serif;outline:none;margin-bottom:16px;transition:border-color .3s}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:var(--text2)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.8rem;color:var(--text);vertical-align:middle}
tr{cursor:pointer;transition:background .2s}
tr:hover td{background:rgba(201,168,76,.04)}
tr.selected td{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.1)}
.tag{display:inline-block;padding:2px 8px;font-size:.58rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;white-space:nowrap}
.tag-high{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.15)}
.tag-med{background:rgba(251,191,36,.1);color:var(--yellow);border:1px solid rgba(251,191,36,.15)}
.tag-low{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.15)}
.tag-cat{background:rgba(201,168,76,.06);color:var(--gold);border:1px solid rgba(201,168,76,.1)}
.tag-nosite{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.15)}
.tag-has{background:rgba(34,197,94,.08);color:var(--green);border:1px solid rgba(34,197,94,.12)}
.phone{color:var(--gold);font-size:.75rem;white-space:nowrap}

/* DETAIL PANEL */
.detail{display:none;background:var(--card);border:1px solid var(--border);margin-top:24px;overflow:hidden}
.detail.open{display:block}
.detail-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.detail-name{font-size:1.1rem;font-weight:700}
.detail-info{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.detail-close{padding:6px 14px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);font-size:.7rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .3s}
.detail-close:hover{color:#fff;border-color:rgba(255,255,255,.15)}
.detail-body{padding:24px}

/* SALES STEPS */
.sales-flow{display:flex;gap:4px;margin-bottom:24px;flex-wrap:wrap}
.sales-step{flex:1;min-width:100px;padding:10px 14px;background:var(--dark);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .3s;position:relative}
.sales-step:first-child{border-radius:4px 0 0 4px}
.sales-step:last-child{border-radius:0 4px 4px 0}
.sales-step:hover{border-color:rgba(255,255,255,.12)}
.sales-step.active{border-color:var(--gold);background:rgba(201,168,76,.06)}
.sales-step .step-num{font-size:.6rem;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.sales-step .step-label{font-size:.72rem;font-weight:600;color:var(--text)}
.sales-step.active .step-label{color:var(--gold)}

.pitch-box{background:var(--dark);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.pitch-box-title{font-size:.72rem;font-weight:600;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pitch-text{font-size:.82rem;line-height:1.9;color:var(--text);white-space:pre-wrap;font-family:'Inter',sans-serif}
.pitch-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 18px;font-size:.7rem;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .3s;border-radius:3px;border:none}
.btn-gold{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--gold)}
.btn-gold:hover{background:var(--gold);color:var(--dark)}
.btn-green{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green)}
.btn-green:hover{background:var(--green);color:#fff}
.btn-red{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.btn-red:hover{background:var(--red);color:#fff}
.btn-yellow{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);color:var(--yellow)}
.btn-yellow:hover{background:var(--yellow);color:var(--dark)}
.btn-wa{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.2);color:#25D366;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-wa:hover{background:#25D366;color:#fff}
.btn.copied{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.no-phone{font-size:.75rem;color:var(--text2);font-style:italic}

.objection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.objection-btn{padding:10px 14px;background:var(--dark);border:1px solid var(--border);cursor:pointer;text-align:left;transition:all .3s;font-family:'Space Grotesk',sans-serif}
.objection-btn:hover{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}
.objection-btn .obj-label{font-size:.68rem;color:var(--red);font-weight:600;margin-bottom:4px}
.objection-btn .obj-text{font-size:.72rem;color:var(--text2)}

@media(max-width:768px){
    nav{padding:0 16px}.nav-links{display:none}
    .page{padding:70px 16px 32px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .sales-flow{flex-direction:column}
    .objection-grid{grid-template-columns:1fr}
}
</style>

// ==================== LEADS PAGE ====================
let selectedLead = null;
let leadFilterCat = 'all';
let leadFilterArea = 'all';

function renderLeads(){
    let data = [...leads];
    if(leadFilterCat!=='all') data=data.filter(l=>l.cat===leadFilterCat);
    if(leadFilterArea!=='all') data=data.filter(l=>l.area===leadFilterArea);

    const total=leads.length;
    const nosite=leads.filter(l=>['none','fb_only','outdated'].includes(l.site)).length;
    const high=leads.filter(l=>l.priority==='high').length;
    const withphone=leads.filter(l=>l.phone).length;

    document.getElementById('leadStats').innerHTML=`
        <div class="stat"><div class="num" style="color:var(--gold)">${total}</div><div class="label">Total</div></div>
        <div class="stat"><div class="num" style="color:var(--red)">${nosite}</div><div class="label">No Website</div></div>
        <div class="stat"><div class="num" style="color:var(--yellow)">${high}</div><div class="label">High Priority</div></div>
        <div class="stat"><div class="num" style="color:var(--green)">${withphone}</div><div class="label">Have Phone</div></div>
    `;

    document.getElementById('leadsBody').innerHTML=data.map((l,i)=>`
        <tr onclick="selectLead(${l.id})" class="${selectedLead&&selectedLead.id===l.id?'selected':''}">
            <td style="color:var(--text2)">${i+1}</td>
            <td><strong style="color:#fff">${l.name}</strong><br><span style="font-size:.62rem;color:var(--text2)">${l.notes}</span></td>
            <td><span class="tag tag-cat">${l.cat}</span></td>
            <td style="font-size:.72rem;color:var(--text2)">${l.area==='bordj'?'Bordj El Kiffan':l.area==='lespins'?'Les Pins':'Mohammadia'}</td>
            <td class="phone">${l.phone||'—'}</td>
            <td>${['none','fb_only','outdated'].includes(l.site)?'<span class="tag tag-nosite">NO SITE</span>':l.site==='basic'?'<span class="tag tag-med">BASIC</span>':'<span class="tag tag-has">HAS</span>'}</td>
            <td>${l.priority==='high'?'<span class="tag tag-high">HIGH</span>':l.priority==='med'?'<span class="tag tag-med">MED</span>':'<span class="tag tag-low">LOW</span>'}</td>
        </tr>
    `).join('');
}

function initLeadFilters(){
    document.getElementById('leadFilters').innerHTML=`
        <button class="filter active" onclick="setLF('cat','all',this)">All</button>
        <button class="filter" onclick="setLF('cat','legal',this)">Legal</button>
        <button class="filter" onclick="setLF('cat','food',this)">Food</button>
        <button class="filter" onclick="setLF('cat','medical',this)">Medical</button>
        <button class="filter" onclick="setLF('cat','retail',this)">Retail</button>
        <button class="filter" onclick="setLF('cat','hotel',this)">Hotels</button>
        <button class="filter" onclick="setLF('cat','services',this)">Services</button>
        <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
        <button class="filter" onclick="setLF('area','lespins',this)">Les Pins</button>
        <button class="filter" onclick="setLF('area','bordj',this)">Bordj El Kiffan</button>
    `;
}

function setLF(key,val,btn){
    if(key==='cat') leadFilterCat=val;
    if(key==='area') leadFilterArea=val;
    renderLeads();
}

function searchLeads(q){
    q=q.toLowerCase();
    document.querySelectorAll('#leadsBody tr').forEach(r=>{
        r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
    });
}

// ==================== SELECT LEAD ====================
function selectLead(id){
    const lead = leads.find(l=>l.id===id);
    if(!lead) return;
    selectedLead = lead;
    renderLeads();
    renderDetail(lead);
}

function renderDetail(l){
    const panel = document.getElementById('detailPanel');
    panel.classList.add('open');

    const siteNote = l.site==='outdated'?'💀 Their site is outdated and bad':l.site==='basic'?'⚠️ Their site is basic/template':l.site==='fb_only'?'📘 Facebook page only — no real site':l.site==='has'?'✅ Has a working site':'🔴 No website at all';

    const openingPitch = l.site==='outdated'?pitchTemplates[l.cat]?.outdated?.(l.name.split('—')[0].trim(),l.notes):pitchTemplates[l.cat]?.opening?.(l.name.split('—')[0].trim())||pitchTemplates.services.opening(l.name.split('—')[0].trim());

    panel.innerHTML=`
        <div class="detail-head">
            <div>
                <div class="detail-name">${l.name}</div>
                <div class="detail-info">
                    <span class="tag tag-cat">${l.cat}</span>
                    <span class="tag ${l.priority==='high'?'tag-high':l.priority==='med'?'tag-med':'tag-low'}">${l.priority.toUpperCase()}</span>
                    <span style="font-size:.72rem;color:var(--text2)">${l.area==='bordj'?'Bordj El Kiffan':l.area==='lespins'?'Les Pins':'Mohammadia'}</span>
                    <span style="font-size:.72rem">${siteNote}</span>
                </div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                ${l.phone?`<a class="btn btn-wa" href="https://wa.me/${l.phone.replace(/[^0-9]/g,'')}" target="_blank">💬 Open WhatsApp</a>`:'<span class="no-phone">No phone number</span>'}
                <button class="detail-close" onclick="closeDetail()">✕ Close</button>
            </div>
        </div>
        <div class="detail-body">
            <div class="sales-flow">
                <div class="sales-step active" onclick="showStep(this,'pitch')"><div class="step-num">Step 1</div><div class="step-label">📩 Send Pitch</div></div>
                <div class="sales-step" onclick="showStep(this,'yes')"><div class="step-num">Step 2</div><div class="step-label">✅ They Say YES</div></div>
                <div class="sales-step" onclick="showStep(this,'no')"><div class="step-num">Step 3</div><div class="step-label">❌ They Say NO</div></div>
                <div class="sales-step" onclick="showStep(this,'follow')"><div class="step-num">Step 4</div><div class="step-label">🔄 Follow-Up</div></div>
                <div class="sales-step" onclick="showStep(this,'close')"><div class="step-num">Step 5</div><div class="step-label">💰 Close & Collect</div></div>
            </div>
            <div id="stepContent">
                ${renderPitchStep(l,openingPitch)}
            </div>
        </div>
    `;
    panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function showStep(el,step){
    el.parentElement.querySelectorAll('.sales-step').forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
    const l = selectedLead;
    const openingPitch = l.site==='outdated'?pitchTemplates[l.cat]?.outdated?.(l.name.split('—')[0].trim(),l.notes):pitchTemplates[l.cat]?.opening?.(l.name.split('—')[0].trim())||pitchTemplates.services.opening(l.name.split('—')[0].trim());
    
    const content = document.getElementById('stepContent');
    if(step==='pitch') content.innerHTML = renderPitchStep(l,openingPitch);
    else if(step==='yes') content.innerHTML = renderYesStep(l);
    else if(step==='no') content.innerHTML = renderNoStep(l);
    else if(step==='follow') content.innerHTML = renderFollowStep(l);
    else if(step==='close') content.innerHTML = renderCloseStep(l);
}

function renderPitchStep(l,text){
    return `
        <div class="pitch-box">
            <div class="pitch-box-title">📩 Opening Pitch — Send this first</div>
            <div class="pitch-text">${text}</div>
            <div class="pitch-actions">
                <button class="btn btn-gold" onclick="copyText(this,\`${text.replace(/`/g,"'")}\`)">📋 Copy Pitch</button>
                ${l.phone?`<a class="btn btn-wa" href="https://wa.me/${l.phone.replace(/[^0-9]/g,'')}" target="_blank">💬 Send on WhatsApp</a>`:''}
            </div>
        </div>
    `;
}

            <div class="pitch-actions"><button class="btn btn-green" onclick="copyText(this,\`${responses.cheaper.replace(/`/g,"'")}\`)">📋 Copy</button></div>
        </div>

            <div class="pitch-text">${p.text}</div>
            <div class="pitch-actions"><button class="btn btn-gold" onclick="copyText(this,\`${p.text.replace(/`/g,"'")}\`)">📋 Copy</button></div>

        <button class="filter active" onclick="setPF('all',this)">All</button>

        <button class="filter" onclick="setPF('food',this)">Food</button>
        <button class="filter" onclick="setPF('hotel',this)">Hotels</button>
        <button class="filter" onclick="setPF('medical',this)">Medical</button>
        <button class="filter" onclick="setPF('retail',this)">Retail</button>
        <button class="filter" onclick="setPF('services',this)">Services</button>
    `;
}

function setPF(val,btn){
    pitchFilterType=val;
    document.querySelectorAll('#pitchFilters .filter').forEach(f=>f.classList.remove('active'));
    btn.classList.add('active');
    renderAllPitches();
}

// ==================== NAVIGATION ====================
function showPage(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    event.target.classList.add('active');
    if(id==='leads') closeDetail();
}

function copyText(btn,text){
    navigator.clipboard.writeText(text);
    btn.textContent='✅ Copied!';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied')},2000);
}

// ==================== INIT ====================
initLeadFilters();
renderLeads();
initPitchFilters();
renderAllPitches();
